<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SLU WebXR - Visualizacao da cabine</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #05070a; overflow: hidden; }
      #viewport { position: fixed; inset: 0; }
      #viewport canvas { display: block; width: 100%; height: 100%; }
      #caption {
        position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
        font-family: system-ui, sans-serif; font-size: 20px; color: #fff;
        background: rgba(0,0,0,0.55); padding: 10px 18px; border-radius: 8px;
        z-index: 10; white-space: nowrap;
      }
      #tag {
        position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
        font-family: system-ui, sans-serif; font-size: 13px; color: #9fb3c8;
        letter-spacing: .05em; text-transform: uppercase; z-index: 10;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>
    <div id="tag">SLU WebXR - visualizacao (simulador, nao comanda elevador real)</div>
    <div id="caption">Conectando...</div>
    <script type="module" src="/src/cinematic.js"></script>
  </body>
</html>
